<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" role="img" aria-labelledby="star-schema-title star-schema-desc" style="background:#0c0f14; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title id="star-schema-title">NusantaraBus Star Schema Dimensional Data Mart</title>
  <desc id="star-schema-desc">Relational diagram showing fact_trips and fact_trip_stages joined with dimension tables for bus analytics.</desc>

  <defs>
    <pattern id="dotGridSchema" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2638" />
    </pattern>

    <marker id="markerFk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <circle cx="5" cy="5" r="3" fill="#38bdf8"/>
    </marker>
    <marker id="markerPk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <rect x="2" y="2" width="6" height="6" fill="#22c55e" rx="1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="#0c0f14"/>
  <rect width="960" height="520" fill="url(#dotGridSchema)" opacity="0.6"/>

  <!-- Diagram Title -->
  <text x="32" y="38" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="-0.3px">Dimensional Data Mart: Star Schema Model</text>
  <text x="32" y="56" fill="#94a3b8" font-size="12">Desain data mart teroptimasi kueri OLAP untuk kalkulasi rasio OTP, atrubusi delay, dan simulasi solar.</text>

  <!-- 1. DIM_OPERATORS (Top Left) -->
  <g transform="translate(32, 84)">
    <rect width="200" height="114" rx="6" fill="#141924" stroke="#242d3d" stroke-width="1.5"/>
    <rect width="200" height="26" rx="6" fill="#1a2232"/>
    <rect y="20" width="200" height="6" fill="#1a2232"/>
    <text x="12" y="17" fill="#f8fafc" font-size="11.5" font-weight="700" font-family="'JetBrains Mono', monospace">dim_operators</text>
    
    <text x="12" y="44" fill="#22c55e" font-size="10.5" font-family="'JetBrains Mono', monospace">PK</text>
    <text x="36" y="44" fill="#f8fafc" font-size="11">operator_id</text>
    <text x="146" y="44" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">INT</text>

    <text x="12" y="62" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="62" fill="#94a3b8" font-size="11">po_name</text>
    <text x="136" y="62" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">VARCHAR</text>

    <text x="12" y="80" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="80" fill="#94a3b8" font-size="11">fleet_tier</text>
    <text x="136" y="80" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">VARCHAR</text>

    <text x="12" y="98" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="98" fill="#94a3b8" font-size="11">headquarters</text>
    <text x="136" y="98" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">VARCHAR</text>
  </g>

  <!-- 2. DIM_ROUTES (Bottom Left) -->

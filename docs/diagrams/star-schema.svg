    <text x="12" y="62" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="62" fill="#94a3b8" font-size="11">origin_city</text>
    <text x="136" y="62" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">VARCHAR</text>

    <text x="12" y="80" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="80" fill="#94a3b8" font-size="11">dest_city</text>
    <text x="136" y="80" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">VARCHAR</text>

    <text x="12" y="98" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="98" fill="#94a3b8" font-size="11">highway_km</text>
    <text x="146" y="98" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">INT</text>

    <text x="12" y="116" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="116" fill="#94a3b8" font-size="11">standard_eta_hr</text>
    <text x="136" y="116" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">FLOAT</text>
  </g>

  <!-- 3. DIM_OPERATOR_SENTIMENT (Bottom Far Left) -->
  <g transform="translate(32, 386)">
    <rect width="200" height="96" rx="6" fill="#141924" stroke="#242d3d" stroke-width="1.5"/>
    <rect width="200" height="26" rx="6" fill="#1a2232"/>
    <rect y="20" width="200" height="6" fill="#1a2232"/>
    <text x="12" y="17" fill="#f8fafc" font-size="11.5" font-weight="700" font-family="'JetBrains Mono', monospace">dim_operator_sentiment</text>

    <text x="12" y="44" fill="#38bdf8" font-size="10.5" font-family="'JetBrains Mono', monospace">FK</text>
    <text x="36" y="44" fill="#f8fafc" font-size="11">operator_id</text>
    <text x="146" y="44" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">INT</text>

    <text x="12" y="62" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="62" fill="#94a3b8" font-size="11">rating_score</text>
    <text x="136" y="62" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">FLOAT</text>

    <text x="12" y="80" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="80" fill="#94a3b8" font-size="11">positive_pct</text>
    <text x="136" y="80" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">FLOAT</text>
  </g>


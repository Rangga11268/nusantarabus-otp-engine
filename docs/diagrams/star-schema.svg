    <rect width="258" height="74" rx="6" fill="#141924" stroke="#242d3d" stroke-width="1.5"/>
    <rect width="258" height="24" rx="6" fill="#1a2232"/>
    <rect y="18" width="258" height="6" fill="#1a2232"/>

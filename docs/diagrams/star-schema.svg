    <text x="12" y="68" fill="#38bdf8" font-size="10.5" font-family="'JetBrains Mono', monospace">FK</text>
    <text x="36" y="68" fill="#94a3b8" font-size="11.5">operator_id</text>
    <text x="195" y="68" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">INT</text>

    <text x="12" y="88" fill="#38bdf8" font-size="10.5" font-family="'JetBrains Mono', monospace">FK</text>
    <text x="36" y="88" fill="#94a3b8" font-size="11.5">route_id</text>
    <text x="195" y="88" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">INT</text>

    <text x="12" y="108" fill="#38bdf8" font-size="10.5" font-family="'JetBrains Mono', monospace">FK</text>
    <text x="36" y="108" fill="#94a3b8" font-size="11.5">date_id</text>
    <text x="195" y="108" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">INT</text>

    <text x="12" y="128" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="128" fill="#f8fafc" font-size="11.5">scheduled_departure</text>
    <text x="180" y="128" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">DATETIME</text>

    <text x="12" y="148" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="148" fill="#f8fafc" font-size="11.5">actual_arrival</text>
    <text x="180" y="148" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">DATETIME</text>

    <text x="12" y="168" fill="#22c55e" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="168" fill="#f8fafc" font-size="11.5" font-weight="600">total_delay_min</text>
    <text x="195" y="168" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">FLOAT</text>

    <text x="12" y="188" fill="#22c55e" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="188" fill="#f8fafc" font-size="11.5" font-weight="600">otp_status</text>
    <text x="180" y="188" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">VARCHAR</text>

    <text x="12" y="208" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="208" fill="#94a3b8" font-size="11.5">fuel_consumed_liters</text>
    <text x="195" y="208" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">FLOAT</text>

    <text x="12" y="228" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="228" fill="#94a3b8" font-size="11.5">avg_speed_kmh</text>
    <text x="195" y="228" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">FLOAT</text>
  </g>

  <!-- 5. DIM_CALENDAR (Top Right) -->
  <g transform="translate(728, 84)">
    <rect width="200" height="114" rx="6" fill="#141924" stroke="#242d3d" stroke-width="1.5"/>
    <rect width="200" height="26" rx="6" fill="#1a2232"/>
    <rect y="20" width="200" height="6" fill="#1a2232"/>
    <text x="12" y="17" fill="#f8fafc" font-size="11.5" font-weight="700" font-family="'JetBrains Mono', monospace">dim_calendar</text>

    <text x="12" y="44" fill="#22c55e" font-size="10.5" font-family="'JetBrains Mono', monospace">PK</text>
    <text x="36" y="44" fill="#f8fafc" font-size="11">date_id</text>
    <text x="146" y="44" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">INT</text>

    <text x="12" y="62" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="62" fill="#94a3b8" font-size="11">full_date</text>
    <text x="146" y="62" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">DATE</text>

    <text x="12" y="80" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="80" fill="#94a3b8" font-size="11">day_name</text>
    <text x="136" y="80" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">VARCHAR</text>

    <text x="12" y="98" fill="#64748b" font-size="10.5" font-family="'JetBrains Mono', monospace">&bull;</text>
    <text x="36" y="98" fill="#94a3b8" font-size="11">is_weekend</text>
    <text x="136" y="98" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">BOOLEAN</text>
  </g>


  <g transform="translate(670, 240)">
    <rect width="258" height="152" rx="6" fill="#131c28" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="258" height="26" rx="6" fill="#182736"/>
    <rect y="20" width="258" height="6" fill="#182736"/>

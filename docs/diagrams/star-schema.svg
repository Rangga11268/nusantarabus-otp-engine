  <!-- RELATIONSHIP CONNECTORS (Orthogonal elbows, r=8, no overlaps) -->
  
  <!-- dim_operators -> fact_trips (1 to N) -->
  <path d="M 232 128 L 291 128 Q 299 128 299 152 L 299 152 Q 299 152 307 152 L 350 152" fill="none" stroke="#64748b" stroke-width="1.5" />
  <rect x="250" y="119" width="36" height="18" rx="3" fill="#0c0f14"/>
  <text x="254" y="132" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace">1 : N</text>

  <!-- dim_routes -> fact_trips (1 to N) -->
  <path d="M 232 290 L 291 290 Q 299 290 299 172 L 299 172 Q 299 172 307 172 L 350 172" fill="none" stroke="#64748b" stroke-width="1.5" />
  <rect x="250" y="281" width="36" height="18" rx="3" fill="#0c0f14"/>
  <text x="254" y="294" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace">1 : N</text>

  <!-- fact_trips -> dim_calendar (N to 1) -->
  <path d="M 610 192 L 669 192 Q 677 192 677 128 L 677 128 Q 677 128 685 128 L 728 128" fill="none" stroke="#64748b" stroke-width="1.5" />
  <rect x="674" y="150" width="36" height="18" rx="3" fill="#0c0f14"/>
  <text x="678" y="163" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace">N : 1</text>

  <!-- fact_trips -> fact_trip_stages (1 to N) -->
  <path d="M 610 240 L 632 240 Q 640 240 640 280 L 640 280 Q 640 280 648 280 L 670 280" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="622" y="250" width="36" height="18" rx="3" fill="#0c0f14"/>
  <text x="626" y="263" fill="#38bdf8" font-size="10" font-family="'JetBrains Mono', monospace">1 : N</text>

  <!-- fact_trip_stages -> dim_checkpoints (N to 1) -->
  <path d="M 799 392 L 799 412" fill="none" stroke="#64748b" stroke-width="1.5" />

  <!-- Footer Legend -->
  <g transform="translate(32, 498)">
    <text x="0" y="12" fill="#64748b" font-size="11" font-family="'JetBrains Mono', monospace">Cardinality: PK (Primary Key) &bull; FK (Foreign Key) &bull; SQLite Relational Integrity Enforced (PRAGMA foreign_keys = ON)</text>

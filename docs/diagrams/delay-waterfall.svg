<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" role="img" aria-labelledby="waterfall-title waterfall-desc" style="background:#0c0f14; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <title id="waterfall-title">Trans-Java 5-Stage Gate Delay Waterfall Breakdown</title>
  <desc id="waterfall-desc">Waterfall chart quantifying how ngetem and rest area dwell times accumulate into +50.7 minutes net delay.</desc>

  <defs>
    <pattern id="dotGridWaterfall" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2638" />
    </pattern>
  </defs>

  <rect width="960" height="420" fill="#0c0f14"/>
  <rect width="960" height="420" fill="url(#dotGridWaterfall)" opacity="0.6"/>

  <!-- Title -->
  <text x="32" y="38" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="-0.3px">Dekomposisi Etape: The Snowball Multiplier of Ngetem</text>
  <text x="32" y="56" fill="#94a3b8" font-size="12">Audit telemetri membuktikan keterlambatan terbesar bersumber dari ngetem awal dan overstay rest area, bukan tol murni.</text>

  <!-- Baseline Grid Lines -->
  <line x1="32" y1="330" x2="928" y2="330" stroke="#242d3d" stroke-width="1.5" />
  <text x="32" y="348" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">BASELINE JADWAL RESMI (0 MNT)</text>

  <!-- STAGE 1: Origin Terminal Dwell (Ngetem) -->
  <g transform="translate(60, 0)">
    <!-- Column: +14.2 min -->
    <rect x="0" y="245" width="120" height="85" rx="4" fill="#f59e0b" opacity="0.85" />
    <text x="60" y="235" fill="#f59e0b" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">+14.2 min</text>
    <text x="60" y="365" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="middle">1. Pul / Terminal</text>
    <text x="60" y="382" fill="#94a3b8" font-size="10" text-anchor="middle">Ngetem Awal Penumpang</text>
  </g>

  <!-- Connecting Line 1 to 2 -->
  <line x1="180" y1="245" x2="220" y2="245" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.5"/>

  <!-- STAGE 2: Arterial Congestion -->
  <g transform="translate(220, 0)">
    <!-- Column: +18.5 min (stacked on top of 14.2) -->
    <rect x="0" y="134" width="120" height="111" rx="4" fill="#f43f5e" opacity="0.85" />
    <text x="60" y="124" fill="#f43f5e" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">+18.5 min</text>
    <text x="60" y="365" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="middle">2. Arteri Kota</text>
    <text x="60" y="382" fill="#94a3b8" font-size="10" text-anchor="middle">Bottleneck GT Cikarut / MBZ</text>
  </g>

  <!-- Connecting Line 2 to 3 -->
  <line x1="340" y1="134" x2="380" y2="134" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.5"/>

  <!-- STAGE 3: Highway Cruising (Time Recovery) -->
  <g transform="translate(380, 0)">
    <!-- Column: -4.1 min (Recovery downwards) -->
    <rect x="0" y="134" width="120" height="25" rx="4" fill="#22c55e" opacity="0.85" />
    <text x="60" y="124" fill="#22c55e" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">-4.1 min</text>
    <text x="60" y="365" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="middle">3. Tol Trans-Jawa</text>
    <text x="60" y="382" fill="#94a3b8" font-size="10" text-anchor="middle">Cruising 90-100 km/h</text>
  </g>

  <!-- Connecting Line 3 to 4 -->
  <line x1="500" y1="159" x2="540" y2="159" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.5"/>

  <!-- STAGE 4: Rest Area Dining Overstay -->
  <g transform="translate(540, 0)">
    <!-- Column: +17.8 min -->
    <rect x="0" y="52" width="120" height="107" rx="4" fill="#f43f5e" opacity="0.85" />
    <text x="60" y="42" fill="#f43f5e" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">+17.8 min</text>
    <text x="60" y="365" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="middle">4. Rest Area Dining</text>
    <text x="60" y="382" fill="#94a3b8" font-size="10" text-anchor="middle">Overstay KM 207 &amp; KM 379</text>
  </g>

  <!-- Connecting Line 4 to 5 -->
  <line x1="660" y1="52" x2="700" y2="52" stroke="#64748b" stroke-dasharray="3,3" stroke-width="1.5"/>

  <!-- STAGE 5: Destination Terminal Arrival -->
  <g transform="translate(700, 0)">
    <!-- Column: +4.3 min -->
    <rect x="0" y="26" width="120" height="26" rx="4" fill="#f59e0b" opacity="0.85" />
    <text x="60" y="18" fill="#f59e0b" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">+4.3 min</text>
    <text x="60" y="365" fill="#f8fafc" font-size="11.5" font-weight="600" text-anchor="middle">5. Terminal Akhir</text>
    <text x="60" y="382" fill="#94a3b8" font-size="10" text-anchor="middle">Bongkar Bagasi Kargo</text>
  </g>

  <!-- TOTAL SUMMARY PILLAR (Focal) -->
  <g transform="translate(840, 0)">
    <rect x="0" y="26" width="70" height="304" rx="4" fill="#38bdf8" />
    <text x="35" y="16" fill="#38bdf8" font-size="13.5" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', monospace">+50.7m</text>
    <text x="35" y="365" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">TOTAL</text>
    <text x="35" y="382" fill="#94a3b8" font-size="10" text-anchor="middle">Net Delay</text>
  </g>
</svg>